<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roteiro da Mídia — protótipo</title>
<style>
:root{
  --bg:#f6f8f7;--card:#fff;--fg:#0f1a17;--mut:#5f6f69;--line:#dbe3df;--hover:#eef3f1;
  --act:#059669;--actf:#fff;--actbg:#ecfdf5;--actbd:#6ee7b7;
  --warn-bg:#fff8e1;--warn-bd:#f3dc9b;--warn-fg:#a16207;
  --c-info:#2563eb;--c-video:#7c3aed;--c-img:#0e7490;--c-ins:#be123c;--c-com:#a16207;--c-aud:#047857;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1311;--card:#141d1a;--fg:#e8f0ed;--mut:#93a59e;--line:#25322e;--hover:#1b2723;
  --act:#34d399;--actf:#052e22;--actbg:#0f2a21;--actbd:#1f6b50;
  --warn-bg:#2a2210;--warn-bd:#5a4716;--warn-fg:#e8c15a;
}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:860px;margin:0 auto}
h1{font-size:17px;margin:0;flex:1 1 200px}
h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px}
.seg button[aria-pressed=true]{background:var(--act);color:var(--actf);font-weight:600}
.roles{max-width:860px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:13px}
.chip[aria-pressed=true]{background:var(--actbg);border-color:var(--actbd);color:var(--act);font-weight:600}
main{max-width:860px;margin:0 auto;padding:14px 16px 90px}
.banner{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-fg);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.banner button{margin-left:auto;border:1px solid var(--warn-bd);background:none;border-radius:8px;padding:3px 10px;color:inherit;white-space:nowrap}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 0 6px;font-weight:700}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:center}
.item .t{font-variant-numeric:tabular-nums;color:var(--mut);width:48px;flex:none;font-size:13px}
.item .n{font-weight:600;flex:1}
.item .n small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut)}
.item.cur{border-color:var(--act);box-shadow:0 0 0 2px var(--actbd)}
.item.past{opacity:.5}
.lock{font-size:12px;color:var(--mut)}
.gap{margin:0 0 0 20px;padding-left:14px;border-left:2px dashed var(--line);min-height:14px}
.cue{display:flex;gap:10px;align-items:flex-start;margin:6px 0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);border-left:4px solid var(--cc,var(--mut))}
.cue.done{opacity:.5}.cue.done .ct{text-decoration:line-through}
.cue.next{border-color:var(--act);box-shadow:0 0 0 2px var(--actbd)}
.cue .ic{font-size:12px;font-weight:700;color:var(--cc);width:70px;flex:none;text-transform:uppercase;padding-top:2px}
.cue .ct{flex:1}
.cue .ct small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.who{font-size:11px;background:var(--hover);border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--mut);font-weight:600}
.aud-open{color:var(--c-aud);font-weight:700}.aud-closed{color:var(--c-ins);font-weight:700}
.cue input[type=checkbox]{width:22px;height:22px;accent-color:var(--act);flex:none;margin-top:1px}
.ghost{border:1px dashed var(--line);background:none;border-radius:8px;padding:3px 10px;color:var(--mut);font-size:13px;margin:4px 0}
.ghost:hover{border-color:var(--act);color:var(--act)}
.mini{border:0;background:none;color:var(--mut);padding:2px 6px;font-size:13px}
form.f{background:var(--card);border:1px solid var(--act);border-radius:12px;padding:12px;margin:6px 0;display:grid;gap:8px;grid-template-columns:1fr 1fr}
form.f .full{grid-column:1/-1}
form.f label{font-size:12px;color:var(--mut);display:grid;gap:3px}
form.f input,form.f select,form.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}
.btns{display:flex;gap:8px;justify-content:flex-end}
.btn{border:1px solid var(--line);background:none;border-radius:8px;padding:7px 14px}
.btn.p{background:var(--act);color:var(--actf);border-color:var(--act);font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.dock .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .now small{color:var(--mut)}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;color:var(--mut);font-size:13px;align-items:center}
@media(max-width:560px){form.f{grid-template-columns:1fr}.cue .ic{width:56px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Culto — 1 de março de 2026<small>Roteiro da Mídia · a liturgia vem do dirigente (somente leitura)</small></h1>
    <div class="seg" role="group" aria-label="Modo">
      <button id="m-plan" aria-pressed="true">Planejar</button>
      <button id="m-live" aria-pressed="false">Ao vivo</button>
    </div>
  </div>
  <div class="roles" id="roles"></div>
</header>
<main>
  <div id="banner"></div>
  <div id="list"></div>
  <div class="foot">
    <span>Protótipo para validação — dados de exemplo do PDF do Planning Center.</span>
    <button class="btn" id="sim">Simular: dirigente trocou REINA ↔ LOUVAI O NOME</button>
    <button class="btn" id="reset">Reiniciar exemplo</button>
  </div>
</main>
<div class="dock" id="dock" hidden>
  <div class="in">
    <div class="now" id="now"></div>
    <button class="btn" id="prev">← Voltar</button>
    <button class="btn p" id="advance">Avançar →</button>
  </div>
</div>

<script>
const ROLES=["Áudio","Câmera","Letras","Switcher"];
const TYPES={
  info:["Info","--c-info"],video:["Vídeo","--c-video"],img:["Imagem","--c-img"],
  ins:["Instrução","--c-ins"],com:["Comentário","--c-com"],aud:["Mesa de som","--c-aud"]
};
// Liturgia do dirigente: somente leitura, a mídia nunca grava aqui.
const SEED_ITEMS=[
  {id:"i1",sec:"Pré-culto",time:"10:15",name:"Música",sub:'Playlist "intro" + cronômetro (Holyrics)'},
  {id:"i2",sec:"Culto",time:"10:30",name:"Boas-vindas",sub:"Dirigente: Hugo Hanashiro · Salmo 130:1-8 (NVT), Rm 3:10, 22, 26 (NVT)"},
  {id:"i3",time:"10:35",name:"QUEBRANTADO",tag:"Música"},
  {id:"i4",time:"10:40",name:"VIVA ESPERANÇA",tag:"Música",sub:"Salmo 130:6 (NVT)"},
  {id:"i5",time:"10:45",name:"REINA",tag:"Música"},
  {id:"i6",time:"10:50",name:"LOUVAI O NOME",tag:"Música"},
  {id:"i7",time:"10:55",name:"Avisos + Oração",sub:"Ordem dos avisos livre"},
  {id:"i8",time:"11:05",name:"Oração comunitária",sub:"Luan Brandão"},
  {id:"i9",time:"11:10",name:"UNIDADE E DIVERSIDADE",tag:"Música"},
  {id:"i10",sec:"Mensagem",time:"11:15",name:"Mensagem",sub:"Ziel Machado · Josué 1:6-9, Gl 4:6-7 (NVT)"},
  {id:"i11",time:"11:45",name:"FRUTOS DE VIDA",tag:"Música"},
  {id:"i12",time:"11:50",name:"Oração final"},
  {id:"i13",sec:"Fim da transmissão",time:"11:50",name:"Tela final",sub:'Playlist "out-tro"'},
  {id:"i14",time:"11:52",name:"Projetar imagem de fim de culto"}
];
// Camada da mídia: cada cue fica preso a um item ("depois de"), não a uma posição.
const SEED_CUES=[
  {after:"i1",type:"aud",audio:"closed",who:"Áudio",text:"Mesa Focusrite fechada"},
  {after:"i1",type:"aud",audio:"open",who:"Áudio",text:"Abrir mesa antes das boas-vindas"},
  {after:"i2",type:"ins",who:"Letras",text:"Projetar Salmo 130:1-8, depois 130:3 e Rm 3:10, 22, 26"},
  {after:"i4",type:"ins",who:"Letras",text:"Projetar Salmo 130:6 durante a música"},
  {after:"i6",type:"com",who:"Câmera",text:"Plano aberto no fim da música; dirigente vai aos avisos"},
  {after:"i6",type:"info",who:"Switcher",text:"Avisos: ordem pode mudar, ficar atento ao dirigente"},
  {after:"i6",type:"video",who:"Switcher",text:"Campanha Casa 46",media:"AVISOS - VIDEO - Video Casa 46 - alta"},
  {after:"i6",type:"img",who:"Letras",text:"Doar (frente)",media:"AVISOS - IMAGEM - Folder_Dar_Frente_Jan26"},
  {after:"i6",type:"img",who:"Letras",text:"Doar (verso)",media:"AVISOS - IMAGEM - Folder_Dar_Verso_Jan26"},
  {after:"i6",type:"img",who:"Letras",text:"Estudo de batismo",media:"AVISOS - IMAGEM - Interessados Batismo"},
  {after:"i6",type:"img",who:"Letras",text:"Café para quem quer conhecer a igreja",media:"AVISOS - IMAGEM - Quem Somos - Cafe.jpg"},
  {after:"i7",type:"img",who:"Letras",text:"Luan Brandão",media:"Oração Comunitária - IMAGEM - Luan Brandão"},
  {after:"i12",type:"aud",audio:"closed",who:"Áudio",text:"Fechar mesa Focusrite"},
  {after:"i14",type:"img",who:"Switcher",text:"Fim de culto (contato)",media:"IMAGEM - FIM DE CULTO"}
].map((c,i)=>({...c,id:"c"+i,done:false}));

const KEY="chorder-midia-proto-v1";
let S;
function fresh(){return{mode:"plan",roles:[],items:JSON.parse(JSON.stringify(SEED_ITEMS)),cues:JSON.parse(JSON.stringify(SEED_CUES)),cur:0,notice:null,editing:null,n:100}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const visible=c=>!S.roles.length||S.roles.includes(c.who);

// sequência única de passos para o modo ao vivo: item, cues dele, próximo item...
function steps(){const out=[];S.items.forEach(it=>{out.push({k:"item",it});S.cues.filter(c=>c.after===it.id&&visible(c)).forEach(c=>out.push({k:"cue",c}))});return out}

function cueHTML(c,live,isNext){
  const [lab,v]=TYPES[c.type];
  const aud=c.type==="aud"?` <span class="aud-${c.audio}">${c.audio==="open"?"ABERTA":"FECHADA"}</span>`:"";
  const body=`<div class="ct">${esc(c.text)}${aud}<span class="who">${esc(c.who)}</span>${c.media?`<small>📎 ${esc(c.media)}</small>`:""}${c.note?`<small>${esc(c.note)}</small>`:""}</div>`;
  const ctl=live
    ?`<input type="checkbox" data-done="${c.id}" ${c.done?"checked":""} aria-label="Feito">`
    :`<button class="mini" data-edit="${c.id}">Editar</button><button class="mini" data-del="${c.id}">Excluir</button>`;
  return `<div class="cue ${c.done?"done":""} ${isNext?"next":""}" style="--cc:var(${v})" id="cue-${c.id}">${live?ctl:""}<div class="ic">${lab}</div>${body}${live?"":ctl}</div>`;
}

function formHTML(c,after){
  const t=c?.type||"info";
  return `<form class="f" data-form="${c?c.id:""}" data-after="${after}">
    <label>Tipo<select name="type">${Object.entries(TYPES).map(([k,[l]])=>`<option value="${k}" ${k===t?"selected":""}>${l}</option>`).join("")}</select></label>
    <label>Responsável<select name="who">${ROLES.map(r=>`<option ${c?.who===r?"selected":""}>${r}</option>`).join("")}</select></label>
    <label class="full">Texto<input name="text" required value="${esc(c?.text||"")}" placeholder="O que precisa acontecer aqui?"></label>
    <label>Mídia / link (opcional)<input name="media" value="${esc(c?.media||"")}" placeholder="nome do arquivo ou URL"></label>
    <label>Se for mesa de som<select name="audio"><option value="open" ${c?.audio==="open"?"selected":""}>Aberta</option><option value="closed" ${c?.audio==="closed"?"selected":""}>Fechada</option></select></label>
    <div class="btns full"><button type="button" class="btn" data-cancel>Cancelar</button><button class="btn p">Salvar</button></div>
  </form>`;
}

function render(){
  const live=S.mode==="live";
  $("#m-plan").setAttribute("aria-pressed",!live);$("#m-live").setAttribute("aria-pressed",live);
  $("#roles").innerHTML=`<span class="lock">${live?"Mostrar só:":"Filtrar por função:"}</span>`+ROLES.map(r=>`<button class="chip" data-role="${r}" aria-pressed="${S.roles.includes(r)}">${r}</button>`).join("");
  $("#banner").innerHTML=S.notice?`<div class="banner"><span>⚠ <b>O dirigente alterou a liturgia:</b> ${esc(S.notice)} Seus cues acompanharam os itens.</span><button data-ack>Entendi</button></div>`:"";
  const st=steps();
  let curIdx=Math.min(S.cur,st.length-1);
  // próximo passo pendente: primeiro cue não feito a partir do item atual
  const curStep=st[curIdx];
  let html="",sec="";
  S.items.forEach((it,ix)=>{
    if(it.sec&&it.sec!==sec){sec=it.sec;html+=`<div class="sec">${esc(sec)}</div>`}
    const isCur=live&&curStep?.k==="item"&&curStep.it.id===it.id;
    const pos=st.findIndex(s=>s.k==="item"&&s.it.id===it.id);
    const past=live&&pos<curIdx&&S.cues.filter(c=>c.after===it.id&&visible(c)).every(c=>c.done);
    html+=`<div class="item ${isCur?"cur":""} ${past?"past":""}" id="item-${it.id}" ${live?`data-jump="${pos}"`:""}>
      <div class="t">${it.time}</div>
      <div class="n">${esc(it.name)}${it.sub?`<small>${esc(it.sub)}</small>`:""}</div>
      ${it.tag?`<span class="tag">${it.tag}</span>`:""}${live?"":`<span class="lock" title="Quem edita é o dirigente">🔒</span>`}
    </div><div class="gap">`;
    S.cues.filter(c=>c.after===it.id&&visible(c)).forEach(c=>{
      if(S.editing===c.id){html+=formHTML(c,it.id);return}
      const isNext=live&&curStep?.k==="cue"&&curStep.c.id===c.id;
      html+=cueHTML(c,live,isNext);
    });
    if(!live){html+=S.editing==="new:"+it.id?formHTML(null,it.id):`<button class="ghost" data-add="${it.id}">+ Cue depois de “${esc(it.name.length>22?it.name.slice(0,22)+"…":it.name)}”</button>`}
    html+=`</div>`;
  });
  $("#list").innerHTML=html;
  $("#dock").hidden=!live;
  if(live&&curStep){
    $("#now").innerHTML=curStep.k==="item"?`<small>Agora</small> <b>${esc(curStep.it.time+" "+curStep.it.name)}</b>`:`<small>Próximo cue</small> <b>${esc(curStep.c.text)}</b> <span class="who">${esc(curStep.c.who)}</span>`;
    $("#advance").textContent=curStep.k==="cue"?"Feito, avançar →":"Avançar →";
  }
}

document.addEventListener("click",e=>{
  const t=e.target;const g=a=>t.closest(`[${a}]`)?.getAttribute(a);
  if(t.id==="m-plan"||t.id==="m-live"){S.mode=t.id==="m-live"?"live":"plan";S.editing=null;save();render();return}
  if(t.id==="reset"){S=fresh();save();render();return}
  if(t.id==="sim"){
    const a=S.items.findIndex(i=>i.id==="i5"),b=S.items.findIndex(i=>i.id==="i6");
    if(a<0||b<0||a>b)return;
    [S.items[a],S.items[b]]=[S.items[b],S.items[a]];
    const tm=S.items[a].time;S.items[a].time=S.items[b].time;S.items[b].time=tm;
    S.notice="REINA e LOUVAI O NOME trocaram de lugar.";save();render();return}
  if(g("data-ack")!==null&&t.closest("[data-ack]")){S.notice=null;save();render();return}
  const role=g("data-role");if(role){S.roles=S.roles.includes(role)?S.roles.filter(r=>r!==role):[...S.roles,role];S.cur=0;save();render();return}
  const add=g("data-add");if(add){S.editing="new:"+add;render();return}
  const ed=g("data-edit");if(ed){S.editing=ed;render();return}
  const del=g("data-del");if(del){S.cues=S.cues.filter(c=>c.id!==del);save();render();return}
  if(t.closest("[data-cancel]")){S.editing=null;render();return}
  const jump=g("data-jump");if(jump!==null&&S.mode==="live"&&t.closest(".item")){S.cur=+jump;save();render();return}
  if(t.id==="advance"||t.id==="prev"){
    const st=steps();const s=st[S.cur];
    if(t.id==="advance"){if(s?.k==="cue")s.c.done=true;S.cur=Math.min(S.cur+1,st.length-1)}
    else{S.cur=Math.max(S.cur-1,0);const p=st[S.cur];if(p?.k==="cue")p.c.done=false}
    save();render();
    document.querySelector(".cur,.next")?.scrollIntoView({block:"center",behavior:"smooth"})}
});
document.addEventListener("change",e=>{
  const id=e.target.getAttribute?.("data-done");if(!id)return;
  const c=S.cues.find(c=>c.id===id);c.done=e.target.checked;save();render();
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form.f");if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f));
  const data={type:d.type,who:d.who,text:d.text.trim(),media:d.media.trim()||undefined,audio:d.type==="aud"?d.audio:undefined};
  const id=f.dataset.form;
  if(id)Object.assign(S.cues.find(c=>c.id===id),data);
  else{
    const after=f.dataset.after;
    const idx=S.cues.map(c=>c.after).lastIndexOf(after);
    const cue={id:"c"+(S.n++),after,done:false,...data};
    if(idx<0)S.cues.push(cue);else S.cues.splice(idx+1,0,cue);
  }
  S.editing=null;save();render();
});
load();render();
</script>
</body>
</html>
